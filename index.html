:root{--g:#0d4a3a;--g2:#145c49;--gold:#b8923a;--bg:#f2f6f3;--ink:#17261f;--mut:#5d6f66;--line:#d5e0d9;--w:#fff;--err:#a3281f}
*{box-sizing:border-box}
body{margin:0;font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
h1,h2,h3{font-family:'Noto Serif Bengali',serif;line-height:1.35;margin:0 0 .5em}
a{color:var(--g2)}
header{background:#fff;color:var(--ink);border-bottom:4px solid var(--g);box-shadow:0 2px 0 var(--gold)}
.bar{max-width:1050px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--g);margin-right:auto}
.hlogo{height:96px;width:auto;display:block}
.logo b{font-family:'Noto Serif Bengali';font-size:1.05rem;display:block;line-height:1.2}
.logo small{opacity:.8;font-size:.78rem}
nav{display:flex;flex-wrap:wrap;gap:2px}
nav a{color:var(--g);text-decoration:none;padding:6px 11px;border-radius:6px;font-size:.93rem}
nav a:hover{background:#e8f0eb}nav a.on{background:var(--g);color:#fff}
main{max-width:1050px;margin:auto;padding:26px 18px 60px}
.hero{background:var(--g);color:#fff;border-radius:14px;padding:38px 30px;margin-bottom:26px;display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center;background-image:radial-gradient(circle at 100% 0,#1b6d57 0,transparent 55%)}
.hero h1{font-size:2rem}.hero p{opacity:.88;margin:0}
.hero .box{background:#fff;color:var(--ink);padding:18px;border-radius:10px}
.hero .box h3{font-size:1.05rem}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:26px 20px}.hero h1{font-size:1.5rem}}
.card{background:var(--w);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
label{display:block;font-weight:500;font-size:.92rem;margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #b9c9c0;border-radius:7px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button{font:inherit;font-weight:600;background:var(--g);color:#fff;border:0;padding:9px 18px;border-radius:7px;cursor:pointer;margin-top:12px}
button:hover{background:var(--g2)}button.alt{background:#fff;color:var(--g);border:1px solid var(--g)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{margin:0;background:#fff;color:var(--g);border:1px solid var(--line)}.tabs button.on{background:var(--g);color:#fff}
.msg{margin-top:10px;font-weight:500}.msg.ok{color:var(--g2)}.msg.bad{color:var(--err)}
table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{background:#e8f0eb;font-weight:600}
.reg{font:600 1.35rem monospace;background:#e8f0eb;padding:8px 14px;border-radius:7px;display:inline-block;letter-spacing:1px}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;background:#e8f0eb;font-size:.82rem;color:var(--g)}
.muted{color:var(--mut)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-bottom:6px}.sub span{font-weight:500}
table.mk td input{width:68px;padding:5px 6px}.mk .grp{background:#f3ead0;color:#6b5314}.mk .tt{font-weight:600;text-align:center}
@media print{header,.noprint,footer{display:none}.card{border:0}}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

async function register(d){
  const dup=await getDocs(query(collection(db,'students'),where('mobile','==',d.mobile)));
  const same=dup.docs.map(x=>x.data()).find(x=>x.name.trim().toLowerCase()==d.name.toLowerCase()&&x.dob==d.dob);
  if(same)return {existing:same};
  return runTransaction(db,async tx=>{
    const cr=doc(db,'meta','counter'),c=await tx.get(cr),n=(c.exists()?c.data().n:0)+1;
    const reg='233'+String(n).padStart(3,'0');
    const rec={...d,reg,t:Date.now()};
    tx.set(cr,{n});tx.set(doc(db,'students',reg),rec);
    return rec;
  });
}

/* ---------- ফলাফল দেখানো ---------- */
function card(r){
  const total=r.total??r.subjects.reduce((a,x)=>a+x.m,0),n=r.subjects.length,avg=r.avg??total/n,fail=r.subjects.filter(x=>x.m<50).length;
  const rm=m=>`<span style="${m<50?'color:var(--err);font-weight:600':''}">${remark(m)}</span>`,v=x=>x??'–';
  return `<div class="card"><img src="${SEAL}" alt="" width="64" height="64" style="float:right;border-radius:50%"><h3>${esc(r.exam)}</h3>
  <p><b>${esc(r.name)}</b> &nbsp;<span class="pill">${esc(r.cls)} শ্রেণি</span> <span class="pill">${esc(r.reg)}</span></p>
  <div style="overflow-x:auto"><table><tr><th>বিষয়</th><th>লিখিত (৩০)</th><th>ব্যবহারিক (৩০)</th><th>মৌখিক (২০)</th><th>আদব (২০)</th><th>মোট (১০০)</th><th>মন্তব্য</th></tr>
  ${r.subjects.map(x=>`<tr><td>${esc(x.n)}</td><td>${v(x.w)}</td><td>${v(x.p)}</td><td>${v(x.o)}</td><td>${v(x.a)}</td><td><b>${x.m}</b></td><td>${rm(x.m)}</td></tr>`).join('')}</table></div>
  <p><b>সর্বমোট: ${total} / ${n*100}</b> &nbsp; <b>গড় নম্বর: ${avg.toFixed(1)}</b> &nbsp; <b>সার্বিক মন্তব্য: ${rm(avg)}</b></p>
  ${fail?`<p class="msg bad">অকৃতকার্য বিষয়: ${fail}টি</p>`:''}
  <p class="muted" style="font-size:.82rem">৯০–১০০ সর্বোত্তম · ৮০–৯০ উত্তম · ৭০–৮০ মধ্যমান · ৫০–৭০ উন্নতি প্রয়োজন · ৫০-এর নিচে অকৃতকার্য</p>
  <button class="alt noprint" onclick="print()">প্রিন্ট করুন</button></div>`;
}
async function showResults(reg,out){
  reg=norm(reg);
  if(!reg){out.innerHTML='';return}
  out.innerHTML='<p class="muted">খোঁজা হচ্ছে…</p>';
  try{
    const rs=(await getDocs(query(collection(db,'results'),where('reg','==',reg)))).docs.map(d=>d.data()).sort((a,b)=>b.t-a.t);
    if(!rs.length){out.innerHTML=`<div class="card"><span class="msg bad">এই রেজিস্ট্রেশন নম্বরে কোনো ফলাফল পাওয়া যায়নি। নম্বরটি আবার দেখুন।</span></div>`;return}
    out.innerHTML=rs.map(card).join('');
  }catch(e){out.innerHTML=`<div class="card"><span class="msg bad">ফলাফল আনতে সমস্যা হয়েছে: ${esc(e.message)}</span></div>`}
}

      tr.querySelector('.tt').textContent=[...tr.querySelectorAll('input')].reduce((a,i)=>a+(+i.value||0),0)};
    let stu=null;
    $('#rg').onchange=async()=>{const r=norm($('#rg').value);$('#rg').value=r;const d=await getDoc(doc(db,'students',r));stu=d.exists()?d.data():null;if(stu&&stu.cls)$('#cl').value=stu.cls;$('#sn2').innerHTML=stu?`শিক্ষার্থী: <b>${esc(stu.name)}</b>`:'<span class="msg bad">এই নম্বরে কোনো শিক্ষার্থী নেই।</span>'};
    $('#sv').onclick=async()=>{
      const tm=$('#tm'),exam=$('#ex').value.trim();await $('#rg').onchange();
      if(!stu)return say(tm,'আগে সঠিক রেজিস্ট্রেশন নম্বর দিন।');
      if(!exam)return say(tm,'পরীক্ষার নাম লিখুন।');
      const subjects=[];
      SUBJ.forEach(g=>g[1].forEach(n=>{let any=false;const v={};
        PARTS.forEach(p=>{const i=document.querySelector(`[data-sub="${n}"][data-k="${p[0]}"]`);if(i.value!=='')any=true;v[p[0]]=Math.min(p[2],Math.max(0,+i.value||0))});
        if(any)subjects.push({n,...v,m:v.w+v.p+v.o+v.a})}));
      if(!subjects.length)return say(tm,'অন্তত একটি বিষয়ের নম্বর দিন।');
      const total=subjects.reduce((a,x)=>a+x.m,0),avg=total/subjects.length;
      try{await setDoc(doc(db,'results',stu.reg+'__'+exam),{reg:stu.reg,name:stu.name,exam,cls:$('#cl').value,subjects,total,avg,t:Date.now()});say(tm,`সংরক্ষিত হয়েছে। সর্বমোট ${total}/${subjects.length*100}, মন্তব্য: ${remark(avg)}।`,1);loadList()}catch(e){say(tm,'সংরক্ষণ হয়নি: '+e.message)}
    };
  }else if(tTab=='site'){
    Promise.all([site('about',DEF_ABOUT),site('board',BOARD)]).then(([ab,bd])=>{
      box.innerHTML=`<h3>সাইটের তথ্য</h3><label for="ab">পরিচিতি (About Us)</label><textarea id="ab" rows="5">${esc(ab)}</textarea><h3 style="margin-top:18px">বোর্ড সদস্য</h3>${[...Array(8).keys()].map(i=>`<div class="row"><input data-r="${i}" placeholder="পদবি" aria-label="পদবি ${i+1}" value="${esc(bd[i]?.[0])}"><input data-p="${i}" placeholder="নাম" aria-label="নাম ${i+1}" value="${esc(bd[i]?.[1])}"></div>`).join('')}<button id="ss">সংরক্ষণ করুন</button><div id="tm"></div>`;
      $('#ss').onclick=async()=>{try{await setDoc(doc(db,'site','about'),{v:$('#ab').value});
        const b=[...Array(8).keys()].map(i=>[$(`[data-r="${i}"]`).value.trim(),$(`[data-p="${i}"]`).value.trim()]).filter(x=>x[0]||x[1]);
        await setDoc(doc(db,'site','board'),{v:b});say($('#tm'),'সংরক্ষিত হয়েছে।',1)}catch(e){say($('#tm'),'সংরক্ষণ হয়নি: '+e.message)}};
    });
  }else if(tTab=='add'){
    box.innerHTML=`<h3>নতুন ছাত্র যোগ করুন</h3><label for="an">শিক্ষার্থীর নাম *</label><input id="an">
    <div class="row"><div><label for="ac">শ্রেণি *</label><select id="ac">${cls}</select></div><div><label for="ad">জন্মতারিখ</label><input id="ad" type="date"></div></div>
    <label for="ai">প্রতিষ্ঠানের নাম</label><input id="ai"><label for="ag">অভিভাবকের নাম</label><input id="ag">
    <label for="am">মোবাইল নম্বর</label><input id="am" inputmode="numeric" placeholder="01XXXXXXXXX"><button id="ab2">যোগ করুন</button><div id="tm"></div>`;
    $('#ab2').onclick=async()=>{
      const tm=$('#tm'),d={name:$('#an').value.trim(),cls:$('#ac').value,dob:$('#ad').value,inst:$('#ai').value.trim(),guardian:$('#ag').value.trim(),mobile:$('#am').value.trim()};
      if(d.name.length<2)return say(tm,'শিক্ষার্থীর নাম লিখুন।');
      if(d.mobile&&!/^01[3-9]\d{8}$/.test(d.mobile))return say(tm,'সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন, অথবা ঘরটি ফাঁকা রাখুন।');
      say(tm,'অপেক্ষা করুন…',1);
      try{const r=await register(d);const x=r.existing||r;tm.className='';
        tm.innerHTML=`<p>${r.existing?'এই শিক্ষার্থী আগেই নিবন্ধিত।':'ছাত্র যোগ হয়েছে।'} <b>${esc(x.name)}</b> (${esc(x.cls||'')} শ্রেণি)</p><span class="reg">${esc(x.reg)}</span><p class="muted">এই রেজিস্ট্রেশন নম্বর শিক্ষার্থীকে জানিয়ে দিন।</p>`;
        if(!r.existing)['an','ad','ai','ag','am'].forEach(i=>$('#'+i).value='')
      }catch(e){say(tm,'যোগ করা যায়নি: '+e.message)}
    };
  }else if(tTab=='tch'){
    box.innerHTML='<h3>শিক্ষক ব্যবস্থাপনা</h3><div id="tl" class="muted">লোড হচ্ছে…</div>';
    const load=async()=>{const l=await all('teachers');$('#tl').className='';
      $('#tl').innerHTML=l.length?`<div style="overflow-x:auto"><table><tr><th>নাম</th><th>মোবাইল</th><th>ইমেইল</th><th>প্রতিষ্ঠান</th><th>অবস্থা</th><th></th></tr>${l.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.mobile)}</td><td>${esc(x.email)}</td><td>${esc(x.inst)}</td><td>${x.approved?'<span class="pill">অনুমোদিত</span>':'<b style="color:var(--err)">অপেক্ষমান</b>'}</td><td style="white-space:nowrap"><button data-ap="${esc(x.id)}" style="margin:0 4px 0 0">${x.approved?'স্থগিত':'অনুমোদন'}</button><button class="alt" data-rm="${esc(x.id)}" style="margin:0">মুছুন</button></td></tr>`).join('')}</table></div>`:'<p>এখনও কোনো শিক্ষক নিবন্ধন করেননি।</p>';
      document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{const x=l.find(y=>y.id==b.dataset.ap),{id,...rest}=x;await setDoc(doc(db,'teachers',id),{...rest,approved:!x.approved});load()});
      document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(confirm('এই শিক্ষককে মুছে ফেলবেন?')){await deleteDoc(doc(db,'teachers',b.dataset.rm));load()}})};
    load().catch(e=>say($('#tl'),'তালিকা আনা যায়নি: '+e.message));
  }else if(tTab=='stu'){
    box.innerHTML=`<h3>নিবন্ধিত শিক্ষার্থী</h3><input id="sq" placeholder="নাম, মোবাইল বা রেজিস্ট্রেশন নম্বর দিয়ে খুঁজুন" aria-label="শিক্ষার্থী খুঁজুন"><div id="sl" class="muted">লোড হচ্ছে…</div>`;
    all('students').then(l=>{
      const draw=()=>{const q=$('#sq').value.trim().toLowerCase(),f=l.filter(x=>[x.name,x.mobile,x.reg,x.inst].join(' ').toLowerCase().includes(q));
        $('#sl').className='';$('#sl').innerHTML=`<p>মোট ${f.length} জন</p><div style="overflow-x:auto"><table><tr><th>রেজিস্ট্রেশন নম্বর</th><th>নাম</th><th>শ্রেণি</th><th>প্রতিষ্ঠান</th><th>অভিভাবক</th><th>মোবাইল</th></tr>${f.map(x=>`<tr><td>${esc(x.reg)}</td><td>${esc(x.name)}</td><td>${esc(x.cls)}</td><td>${esc(x.inst)}</td><td>${esc(x.guardian)}</td><td>${esc(x.mobile)}</td></tr>`).join('')}</table></div>`};
      $('#sq').oninput=draw;draw();
    }).catch(e=>say($('#sl'),'তালিকা আনা যায়নি: '+e.message));
  }else if(tTab=='book'){
    box.innerHTML=`<h3>বই আপলোড</h3><label for="bt">বইয়ের নাম</label><input id="bt"><label for="bc">শ্রেণি</label><select id="bc">${cls}</select><label for="bf">PDF ফাইল</label><input id="bf" type="file" accept="application/pdf"><label for="bu">অথবা বইয়ের লিংক (ফাইল না দিলে)</label><input id="bu" placeholder="https://"><button id="bs">আপলোড করুন</button><div id="tm"></div>`;
    $('#bs').onclick=async()=>{
      const tm=$('#tm'),t=$('#bt').value.trim(),f=$('#bf').files[0];let url=$('#bu').value.trim();
      if(!t)return say(tm,'বইয়ের নাম লিখুন।');if(!f&&!url)return say(tm,'ফাইল বা লিংক দিন।');
      try{say(tm,'আপলোড হচ্ছে…',1);
        if(f){const r=ref(st,'books/'+Date.now()+'_'+f.name.replace(/[^\w.-]/g,'_'));await uploadBytes(r,f);url=await getDownloadURL(r)}
        await addDoc(collection(db,'books'),{title:t,cls:$('#bc').value,url,t:Date.now()});say(tm,'বই যুক্ত হয়েছে।',1);loadList()
      }catch(e){say(tm,'আপলোড হয়নি: '+e.message)}
    };
  }else{
    const isN=tTab=='notice';
    box.innerHTML=isN?`<h3>নোটিশ প্রকাশ</h3><label for="f1">শিরোনাম</label><input id="f1"><label for="f2">বিবরণ</label><textarea id="f2" rows="4"></textarea><button id="fs">প্রকাশ করুন</button><div id="tm"></div>`
    :`<h3>প্রতিষ্ঠান যুক্ত করুন</h3><label for="f1">প্রতিষ্ঠানের নাম</label><input id="f1"><label for="f2">ঠিকানা</label><input id="f2"><label for="f3">প্রতিষ্ঠান কোড (ঐচ্ছিক)</label><input id="f3"><button id="fs">যুক্ত করুন</button><div id="tm"></div>`;
    $('#fs').onclick=async()=>{
      const a=$('#f1').value.trim(),b=$('#f2').value.trim(),tm=$('#tm');if(!a)return say(tm,'প্রথম ঘরটি পূরণ করুন।');
      try{await addDoc(collection(db,isN?'notices':'institutions'),isN?{title:a,body:b,t:Date.now()}:{name:a,address:b,code:$('#f3').value.trim(),t:Date.now()});say(tm,'সংরক্ষিত হয়েছে।',1);$('#f1').value=$('#f2').value='';loadList()}catch(e){say(tm,'সংরক্ষণ হয়নি: '+e.message)}
    };
  }
}

const LOGO=document.querySelector(".hlogo").src;
const SEAL=document.querySelector(".fseal").src;
const DEF_ABOUT='PCTB (নববী শিক্ষাক্রম ও পাঠ্যপুস্তক বোর্ড) রাসুলুল্লাহ ﷺ-এর আদর্শের আলোকে শিক্ষাক্রম প্রণয়ন, পাঠ্যপুস্তক প্রকাশ এবং পরীক্ষার ফলাফল ব্যবস্থাপনার দায়িত্ব পালন করে।';
async function site(k,def){try{const d=await getDoc(doc(db,'site',k));return d.exists()?d.data().v:def}catch{return def}}
const LISTS={result:['results',r=>`${r.reg} — ${r.name} — ${r.exam}`],book:['books',b=>`${b.title} (${b.cls} শ্রেণি)`],notice:['notices',n=>n.title],inst:['institutions',i=>i.name]};
async function loadList(){
  const el=$('#ml'),L=LISTS[tTab];if(!el)return;if(!L){el.innerHTML='';return}
  const l=await all(L[0]);
  el.innerHTML=`<h3>সংরক্ষিত তালিকা (${l.length})</h3>`+(l.map(x=>`<div class="card" style="display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px"><span>${esc(L[1](x))}</span><button class="alt" data-del="${esc(x.id)}" style="margin:0">মুছুন</button></div>`).join('')||'<p class="muted">এখনও কিছু নেই।</p>');
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('মুছে ফেলবেন?')){await deleteDoc(doc(db,L[0],b.dataset.del));loadList()}});
}
function bindTextbook(){document.querySelectorAll('a[href^="data:"]').forEach(a=>a.onclick=async e=>{e.preventDefault();const b=await (await fetch(a.href)).blob();open(URL.createObjectURL(b))})}

/* ---------- রাউটার ---------- */
async function route(){
  const p=(location.hash.replace(/^#\/?/,'').split('?')[0])||'';
  const k=pages.some(x=>x[0]==p)?p:'';
  $('#demoB').hidden=!DEMO;$('#nav').innerHTML=pages.map(x=>`<a href="#/${x[0]}" class="${x[0]==k?'on':''}">${x[1]}</a>`).join('');
  const app=$('#app');app.innerHTML='<p class="muted">লোড হচ্ছে…</p>';
  try{app.innerHTML=await V[k||'home']()}catch(e){app.innerHTML=`<div class="card"><span class="msg bad">ডেটা আনতে সমস্যা হয়েছে: ${esc(e.message)}</span><p class="muted">Firebase কনফিগ ও Firestore রুলস ঠিক আছে কি না দেখুন।</p></div>`;return}
  ({'':bindHome,result:bindResult,student:bindStudent,teacher:bindTeacher,textbook:bindTextbook}[k]||(()=>{}))();if(k=='teacher'&&user)loadList();
  scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script>
